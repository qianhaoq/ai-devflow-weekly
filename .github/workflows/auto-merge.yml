# Example caller for the reusable Auto Merge — copy to
# YOUR_REPO/.github/workflows/auto-merge.yml.
#
# Check name produced by this example (job id `auto-merge`):
#   - "auto-merge / Auto Merge"
# (That check is intentionally NOT in required_checks — a run cannot
# gate itself.)
#
# workflow_run fires when the named workflows complete. Note:
#   - workflow_run only triggers from the default branch, once this file
#     is merged there.
#   - The names below must match the `name:` of YOUR repo's caller
#     workflows (see examples/ci.yml, codex-gate.yml, qa-gate.yml).
#   - Runs those workflows start from `push` are skipped by the reusable
#     workflow; runs from `pull_request` are matched to a PR by head SHA;
#     every other origin (pull_request_target / issue_comment / review /
#     schedule / dispatch) triggers a sweep of ALL open non-draft PRs
#     targeting the default branch (cap 30).
#
# Concurrency is the caller's job (a reusable workflow cannot own the
# caller's event stream). Use exactly the group below with
# cancel-in-progress: false — events QUEUE behind an in-flight
# evaluation of the same PR (or behind another sweep) instead of
# cancelling it, so a merge in progress is never interrupted.
# Per-PR where the PR is known: pull_request_review /
# workflow_dispatch(pr_number) / workflow_run whose triggering event was
# `pull_request` (head SHA identifies the PR). Everything else shares
# the `auto-merge-sweep` group.

name: Auto Merge

on:
  workflow_run:
    workflows: ["CI", "Codex Review Gate", "QA Gate"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-evaluate (e.g. after resolving review threads)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && format('auto-merge-pr-{0}', github.event.inputs.pr_number)) || (github.event_name == 'pull_request_review' && format('auto-merge-pr-{0}', github.event.pull_request.number)) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && format('auto-merge-pr-{0}', github.event.workflow_run.head_sha)) || 'auto-merge-sweep' }}
  cancel-in-progress: false

jobs:
  auto-merge:
    uses: qianhaoq/devflow-gates/.github/workflows/auto-merge.yml@f69810a2d3ad81b1b69700ff060fb6e119f83d88  # devflow-gates main @ f69810a (pinned; bump deliberately)
    with:
      # Exact check-run names = "<caller job name> / <called job name>"
      # from YOUR ci.yml / codex-gate.yml / qa-gate.yml callers. "ci / Secret Scan"
      # is required so a red gitleaks run can never be auto-merged.
      required_checks: |
        ci / Build & Test
        codex / Codex Review Gate
        ci / Secret Scan
        qa / QA Gate
        editorial / QA Gate
      merge_method: squash
      require_copilot: true   # soft-path: official check may be missing; head Copilot review required, CHANGES_REQUESTED vetoes

  # A merge made with GITHUB_TOKEN does not fire `push`, so pages.yml would
  # never deploy a bot merge. After an Auto Merge evaluation, dispatch Pages
  # ONLY for a merged PR on main: the workflow must run on refs/heads/main
  # (workflow_run / dispatch run from the default branch), main's head must
  # be the merge commit of a PR with merged_at set and base main, and the
  # dispatch always targets ref main — PR head code is never deployed.
  deploy-after-merge:
    needs: auto-merge
    if: >-
      always() && needs.auto-merge.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main') { core.info(`ref ${context.ref} is not main — no deploy`); return; }
            const { data: br } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = br.commit.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const merged = prs.find((p) => p.merged_at && p.base.ref === 'main' && p.merge_commit_sha === sha);
            if (!merged) { core.info(`main @ ${sha.slice(0, 7)} is not a merged-PR commit — no deploy`); return; }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'pages.yml', head_sha: sha, per_page: 1,
            });
            if (runs.total_count > 0) { core.info(`Pages already ran for ${sha.slice(0, 7)}`); return; }
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: 'main' });
            core.info(`Dispatched Pages for main @ ${sha.slice(0, 7)} (merged PR #${merged.number})`);
