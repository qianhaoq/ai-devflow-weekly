# Acceptance Gate (M1, observe-only) — reusable workflow from
# qianhaoq/devflow-gates. Produces "acceptance / Acceptance Gate" (plus
# helper checks "acceptance / Acceptance Config" / "Acceptance Measure").
# NOT a required check: do not add it to branch protection in M1.
# Config: .github/acceptance.yml. Must stay on pull_request (the Measure job
# runs PR code). The gate never adds or removes labels.

name: Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions: {}

jobs:
  acceptance:
    permissions:
      contents: read
      pull-requests: write   # sticky report comment
      checks: read           # read the Codex gate result
    uses: qianhaoq/devflow-gates/.github/workflows/acceptance.yml@1335569ba86645df8be423e42c136a2625aaeebb # devflow-gates main @ 1335569
