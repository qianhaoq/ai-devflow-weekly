name: Crawl

on:
  schedule:
    - cron: "17 23 * * *" # 07:17 北京时间
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    name: Fetch, draft & open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 若已有未合并的 crawl PR，先把它分支上的条目（含编辑手工提交的
      # verified=true / 摘要修改）叠加到工作区，再抓取新条目。否则
      # create-pull-request 从 main 重建 crawl/auto 并 force-push，会覆盖人工审核结果。
      - name: Carry over open crawl PR edits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head crawl/auto --state open --json number -q '.[0].number')" ]; then
            git fetch --no-tags origin crawl/auto
            git checkout FETCH_HEAD -- data/items
            # page_diff 的页面哈希状态也要沿用，否则同一次页面变化会每天再生成一条重复条目
            if git cat-file -e FETCH_HEAD:data/state 2>/dev/null; then git checkout FETCH_HEAD -- data/state; fi
            echo "已叠加 crawl/auto 上的条目与抓取状态"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python scripts/fetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft summaries
        run: python scripts/draft.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}  # 默认值只在 scripts/draft.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # release API 认证，避免 60 次/小时限流

      - name: Validate items
        run: python scripts/validate.py

      - name: Build weekly
        run: python scripts/weekly.py

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: crawl/auto
          title: "chore(crawl): 每日抓取"
          commit-message: "chore(crawl): 每日抓取（fetch + draft + weekly）"
          body: |
            自动抓取生成的条目数据与周刊更新。

            - 运行 `python scripts/validate.py` 已通过
            - 人工复核后再合并；`no-auto-merge` 标签表示禁止自动合并
          labels: |
            no-auto-merge
          delete-branch: true

      # A push made with GITHUB_TOKEN does not start the QA / editorial gate's
      # pull_request_target run, so the gate cannot strip sign-off labels from
      # an updated crawl PR. Do it here: any update to crawl/auto invalidates
      # qa-passed / editorial-approved (an editor must re-review the new head).
      - name: Invalidate sign-off labels on updated crawl PR
        if: steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for label in qa-passed editorial-approved; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" 2>/dev/null \
              && echo "removed $label from #$PR" || echo "$label not present on #$PR"
          done
