name: Crawl

on:
  schedule:
    - cron: "17 23 * * *" # 07:17 北京时间
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  crawl:
    name: Fetch, draft & open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # carry-over 需要 merge-base

      # 若已有未合并的 crawl PR，把它相对 merge-base 的改动（新条目、编辑手工
      # 提交的 verified=true / 摘要修改、page_diff 状态）重放到最新 main 上，再
      # 抓取新条目。只重放 diff：main 上更新的修正不会被旧树覆盖，分支里删除的
      # 文件也会被删除。重放冲突则失败，交人工处理。否则 create-pull-request
      # 从 main 重建 crawl/auto 并 force-push，会丢掉人工审核结果。
      - name: Carry over open crawl PR edits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head crawl/auto --state open --json number -q '.[0].number')" ]; then
            git fetch --no-tags origin main crawl/auto
            base=$(git merge-base origin/main origin/crawl/auto)
            git diff --binary "$base" origin/crawl/auto -- data/items data/state > /tmp/crawl-pr.diff
            if [ -s /tmp/crawl-pr.diff ]; then
              git apply --3way --index /tmp/crawl-pr.diff
              git reset -q   # 只保留工作区改动，交给 create-pull-request 提交
            fi
            echo "已重放 crawl/auto 相对 $base 的条目与状态改动"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python scripts/fetch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft summaries
        run: python scripts/draft.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}  # 默认值只在 scripts/draft.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # release API 认证，避免 60 次/小时限流

      - name: Validate items
        run: python scripts/validate.py

      - name: Build weekly
        run: python scripts/weekly.py

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: crawl/auto
          title: "chore(crawl): 每日抓取"
          commit-message: "chore(crawl): 每日抓取（fetch + draft + weekly）"
          body: |
            自动抓取生成的条目数据与周刊更新。

            - 运行 `python scripts/validate.py` 已通过
            - 人工复核后再合并；`no-auto-merge` 标签表示禁止自动合并
          labels: |
            no-auto-merge
          delete-branch: true

      # A push made with GITHUB_TOKEN does not start the QA / editorial gate's
      # pull_request_target run, so the gate cannot strip sign-off labels from
      # an updated crawl PR. Do it here: any update to crawl/auto invalidates
      # qa-passed / editorial-approved (an editor must re-review the new head).
      - name: Invalidate sign-off labels on updated crawl PR
        if: steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for label in qa-passed editorial-approved; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" 2>/dev/null \
              && echo "removed $label from #$PR" || echo "$label not present on #$PR"
          done

      # PR 由 GITHUB_TOKEN 创建/推送，pull_request（CI/Acceptance）运行会停在
      # action_required 等待批准，pull_request_target 门禁则不会启动。
      # workflow_dispatch 运行不算 PR checks 或 required checks，参见 GitHub 文档：
      # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/troubleshooting-required-status-checks
      # (1) 用 REST approve 端点批准此 head SHA 待批准的 pull_request 运行，
      # 保持 event=pull_request，让 checks 关联到 PR。
      # (2) 评论 @codex review，让 chatgpt-codex-connector 提交 review；其
      # pull_request_review 事件触发 codex-gate 的真实评估。
      # (3) editorial / QA Gate 仍只由编辑打 editorial-approved 标签触发，
      # 该人工 labeled 事件也会重跑 CI。禁止自动合并。
      - name: Start PR checks on crawl PR head
        if: steps.cpr.outputs.pull-request-number != '' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A approved_ids=()
          declare -A ci_ids=()
          ci_found=false
          for attempt in {1..18}; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&per_page=100")
            for id in $(jq -r '.workflow_runs[] | select(.conclusion=="action_required" and .name=="CI") | .id' <<< "$runs"); do
              ci_ids[$id]=1
            done
            ids=$(jq -r '.workflow_runs[] | select(.conclusion=="action_required") | .id' <<< "$runs")
            for id in $ids; do
              if [ -z "${approved_ids[$id]:-}" ]; then
                if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; then
                  echo "approved run $id"
                  approved_ids[$id]=1
                else
                  echo "::warning::approve failed for run $id (editor label will start CI)"
                fi
              fi
            done
            if [ -n "${!ci_ids[*]}" ]; then
              ci_found=true
              for id in "${!ci_ids[@]}"; do
                if [ -z "${approved_ids[$id]:-}" ]; then
                  ci_found=false
                  break
                fi
              done
              if [ "$ci_found" = true ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          if [ "$ci_found" = false ]; then
            echo "::warning::CI pull_request run for $SHA not approved"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@codex review"
