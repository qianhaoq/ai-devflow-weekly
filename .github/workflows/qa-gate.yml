# Example caller: copy to .github/workflows/qa-gate.yml.
# Required check: "qa / QA Gate".
# pull_request_target uses trusted base YAML; never check out or execute PR code.
# Also install qa-gate-cancel-heal.yml: self-listening workflow_run is invalid.
# Irrelevant labels mirror only a same-named real gate verdict; success requires
# current relevant-label state to match the source verdict's event history.
# Evaluate and ack share label-{sha}; unrelated-label ack never cancels evaluation.
# Push, refresh, and heal runs remain isolated; reruns never cancel new pushes.
name: QA Gate

on:
  pull_request_target:
    # `edited` covers a base retarget (GitHub sends `edited`, not
    # `synchronize`). Always evaluated by the job-level `if`: a
    # skipped required check counts as passing in branch protection, so a
    # title/body edit would turn a red check green. Every edit re-runs the
    # full evaluation instead (cheap, fail-safe).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  # Repository refresh cadence; retained alongside event-driven refresh.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  # Shared label-{sha} is the main lock: evaluate and ack cannot run concurrently.
  # Only relevant-label evaluate cancels running work; unrelated-label ack never does.
  # Ack may replace a pending evaluate; mirror label-event time validation then
  # rejects stale success with failure, rather than bypassing that evaluation.
  group: >-
    qa-gate-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && format('label-{0}', github.event.pull_request.head.sha) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && ((github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) || (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && contains(fromJSON('["qa-passed","editorial-approved","no-auto-merge"]'), github.event.label.name))) }}

jobs:
  qa:
    # Real evaluate: non-label PRT events, or labeled/unlabeled for the
    # QA label / no-auto-merge. Irrelevant labels go to qa-label-ack (anti-ghost).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         (github.event.label.name == 'qa-passed' || github.event.label.name == 'no-auto-merge')))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the skipped refresh job, which needs actions: write);
    # the evaluator itself narrows to actions: read.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2
    with:
      # runs_on: self-hosted   # optional; default ubuntu-latest (also set on qa-refresh if enabled)
      qa_label: 'qa-passed'   # keep in sync with the `if:` above and qa-label-ack
      # allowed_labelers: 'alice, bob'   # optional: only these users' label counts
      # keep_qa_on_clean_main_update: true   # optional: a clean "update branch" merge of main keeps the label


  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job.
  qa-label-ack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'qa-passed' && github.event.label.name != 'no-auto-merge'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2
    with:
      relevant_labels: 'qa-passed,no-auto-merge'
      check_name: 'qa / QA Gate'
      # runs_on: self-hosted   # keep in sync with qa job above

  # Repository scheduled refresh path.
  qa-refresh:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2

  # Editorial sign-off (docs/MERGE_GATES.md §4): the same reusable label
  # gate, keyed on `editorial-approved`. Produces the required check
  # "editorial / QA Gate"; the label is stripped on every new push, so the
  # editorial agent must re-approve the exact head it reviewed.
  editorial:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         (github.event.label.name == 'editorial-approved' || github.event.label.name == 'no-auto-merge')))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2
    with:
      qa_label: 'editorial-approved'
      # Only these users' `labeled` event counts (timeline/events API actor
      # check in devflow-gates). Override with repo variable
      # EDITORIAL_LABELERS (comma-separated). A PR author who is not listed
      # cannot self-approve.
      allowed_labelers: ${{ vars.EDITORIAL_LABELERS || 'qianhaoq' }}

  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job.
  editorial-label-ack:
    if: >-
      github.event_name == 'pull_request_target' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'editorial-approved' && github.event.label.name != 'no-auto-merge'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@7e029a2c7d549e86e80331267928281f53ba180b # devflow-gates main @ 7e029a2
    with:
      relevant_labels: 'editorial-approved,no-auto-merge'
      check_name: 'editorial / QA Gate'
      # runs_on: self-hosted   # keep in sync with editorial job above
