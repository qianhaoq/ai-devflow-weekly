# Example caller for the reusable QA Gate — copy to
# YOUR_REPO/.github/workflows/qa-gate.yml.
#
# Required-check name produced by this example (job id `qa`):
#   - "qa / QA Gate"
#
# pull_request_target keeps the workflow YAML on the trusted base branch.
#
# IMPORTANT: the gate REMOVES the QA label on every new push
# (synchronize) and whenever it finds a stale label, which needs write
# access — the caller must grant pull-requests: write and issues: write
# (a reusable workflow can only restrict permissions further, never
# elevate them).
#
# Triggers (PR-only): every QA input change — push, label, draft/ready —
# is itself a pull_request_target event. This repository also retains its
# scheduled refresh path. labeled/unlabeled for the QA label (`qa-passed`) →
# real evaluate (job `qa`). Any OTHER label → job `qa-label-ack` mirrors
# the latest "qa / QA Gate" conclusion via Checks API (avoids "is
# expected" ghost without burning a full QA evaluate + write ceiling on
# triage labels). synchronize is NEVER filtered.
#
# Concurrency (a label event can never cancel a push evaluation):
#   - push-class runs (opened / synchronize / reopened) share one group per
#     PR with cancel-in-progress: a newer commit cancels only the
#     evaluation of the OLDER head (whose check sits on the old SHA; the
#     newer run strips the label anyway).
#   - labeled/unlabeled MUST share label-{head.sha} + cancel-in-progress
#     (Plan B) across evaluate + ack: this is the primary TOCTOU lock.
#     Mirror revalidation is defense only. A later triage label
#     may cancel unfinished qa-passed evaluate; reapply it or /recheck.
#   - every other run (ready / draft / dispatch /
#     skipped) gets its own group: never cancelled, never cancels.
# The gate itself does not rely on this: the sign-off is bound to the head
# SHA via server-side run records and a stale label is stripped on ANY
# event (fail closed), even if a push run was cancelled.

# cancel-heal requires upstream devflow-gates companion workflow support; never self-listen.

name: QA Gate

on:
  pull_request_target:
    # `edited` covers a base retarget (GitHub sends `edited`, not
    # `synchronize`). Always evaluated by the job-level `if`: a
    # skipped required check counts as passing in branch protection, so a
    # title/body edit would turn a red check green. Every edit re-runs the
    # full evaluation instead (cheap, fail-safe).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  # Repository refresh cadence; retained alongside event-driven refresh.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate (dispatch on the PR branch to attach the check)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

# Re-run attempts (run_attempt > 1, e.g. from a refresh) never join the
# cancelling push group: a re-run of an OLD head's synchronize run would
# otherwise cancel the newest head's evaluation.
concurrency:
  # Plan B: serialize label evaluate + ack by PR + SHA to close mirror TOCTOU.
  # A later triage label can cancel an unfinished relevant-label evaluate;
  # accepted tradeoff: reapply the relevant label or use /recheck to evaluate.
  group: >-
    qa-gate-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'none' }}-${{
    (github.event_name == 'pull_request_target' && github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) && 'push' ||
    (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) && format('label-{0}', github.event.pull_request.head.sha) ||
    format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && ((github.run_attempt == '1' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) || contains(fromJSON('["labeled","unlabeled"]'), github.event.action)) }}

jobs:
  qa:
    # Real evaluate: non-label PRT events, or labeled/unlabeled for the
    # QA label only. Irrelevant labels go to qa-label-ack (anti-ghost).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'qa-passed'))
    # GitHub checks EVERY job of the called file against this job's
    # ceiling (incl. the skipped refresh job, which needs actions: write);
    # the evaluator itself narrows to actions: read.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      # runs_on: self-hosted   # optional; default ubuntu-latest (also set on qa-refresh if enabled)
      qa_label: 'qa-passed'   # keep in sync with the `if:` above and qa-label-ack
      # allowed_labelers: 'alice, bob'   # optional: only these users' label counts
      # keep_qa_on_clean_main_update: true   # optional: a clean "update branch" merge of main keeps the label


  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job.
  qa-label-ack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'qa-passed'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      check_name: 'qa / QA Gate'
      # runs_on: self-hosted   # keep in sync with qa job above

  # Repository scheduled refresh path.
  qa-refresh:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)

  # Editorial sign-off (docs/MERGE_GATES.md §4): the same reusable label
  # gate, keyed on `editorial-approved`. Produces the required check
  # "editorial / QA Gate"; the label is stripped on every new push, so the
  # editorial agent must re-approve the exact head it reviewed.
  editorial:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'editorial-approved'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: qianhaoq/devflow-gates/.github/workflows/qa-gate.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      qa_label: 'editorial-approved'
      # Only these users' `labeled` event counts (timeline/events API actor
      # check in devflow-gates). Override with repo variable
      # EDITORIAL_LABELERS (comma-separated). A PR author who is not listed
      # cannot self-approve.
      allowed_labelers: ${{ vars.EDITORIAL_LABELERS || 'qianhaoq' }}

  # Anti-ghost ack (方案 B): irrelevant labels must NOT skip every job.
  editorial-label-ack:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'editorial-approved'
    permissions:
      contents: read
      checks: write
      actions: write
      issues: write
    uses: qianhaoq/devflow-gates/.github/workflows/mirror-required-check.yml@42fdd49f44c69f4e748c6f8e9bf1ac2b0ffb18e2  # devflow-gates main @ 42fdd49 (方案 B; bump deliberately)
    with:
      check_name: 'editorial / QA Gate'
      # runs_on: self-hosted   # keep in sync with editorial job above
